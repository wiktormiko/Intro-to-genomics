name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"   # matches Bioconductor 3.20 used locally
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/rlib
          key: rlib-${{ runner.os }}-${{ hashFiles('.github/workflows/publish.yml') }}
      # Add a package to this list whenever a new Rmd needs one (this file's hash is the cache key).
      - name: Install R packages
        run: |
          mkdir -p ~/rlib
          Rscript -e '.libPaths("~/rlib"); install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/"); pak::pkg_install(c("knitr", "rmarkdown", "tidyverse", "bioc::DESeq2", "bioc::airway", "bioc::PCAtools", "stephenturner/annotables"))'
        env:
          R_LIBS_USER: ~/rlib
      - run: quarto render
        env:
          R_LIBS_USER: ~/rlib
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
